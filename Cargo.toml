[package]
name = "komga"
version = "0.1.0"
edition = "2021"
description = "Comics/manga server — orca service-backend"

[package.metadata.orca]
category = "media"

[lib]
name = "komga"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "komga"
path = "src/main.rs"

# komga registers a ServiceBackend plus its `komga.` endpoint and library
# tools over the orca socket, reaching orca through plugin-toolkit alone.
# `delegated-http` sends every Komga request through orca's `http.request`
# capability, so no reqwest/rustls is linked; `tools` + `db` carry the
# `#[orca_tool]` and `#[endpoint_resource]` surface.
[dependencies]
plugin-toolkit = { git = "https://gitea.scottkey.me/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }

# Names the generated client's own crate-root paths: the codegen rewrites
# serde/serde_json/reqwest/progenitor_client to `::plugin_toolkit::*`, but emits
# bare `::thiserror`.

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[build-dependencies]
plugin-toolkit-build = { git = "https://gitea.scottkey.me/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit-build" }

[lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
